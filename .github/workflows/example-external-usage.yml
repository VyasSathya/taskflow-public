# Example: Using VibeTasks Error Capture in External Repositories
#
# This workflow shows how to use VibeTasks error capture without
# installing the action locally. It uses inline scripts.
#
# Copy this workflow to your repository and configure the secrets.

name: CI with VibeTasks (External)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Configure these in your repository secrets
  SUPABASE_URL: ${{ secrets.VIBETASKS_SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.VIBETASKS_SUPABASE_KEY }}
  VIBETASKS_USER_ID: ${{ secrets.VIBETASKS_USER_ID }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        id: build
        run: npm run build 2>&1 | tee build.log
        continue-on-error: true

      - name: Test
        id: test
        run: npm test 2>&1 | tee test.log
        continue-on-error: true

      - name: Create VibeTasks on Failure
        if: steps.build.outcome == 'failure' || steps.test.outcome == 'failure'
        run: |
          # Collect error logs
          ERROR_LOG=""
          if [ -f build.log ]; then
            ERROR_LOG=$(tail -100 build.log)
          fi
          if [ -f test.log ]; then
            ERROR_LOG="${ERROR_LOG}\n$(tail -100 test.log)"
          fi
          
          # Detect error type
          ERROR_TYPE="CI Failure"
          ERROR_SUMMARY="Build or test failed"
          
          if echo "$ERROR_LOG" | grep -q "error TS"; then
            ERROR_TYPE="TypeScript Error"
            ERROR_SUMMARY=$(echo "$ERROR_LOG" | grep -m1 "error TS" | head -c 100)
          elif echo "$ERROR_LOG" | grep -q "FAIL"; then
            ERROR_TYPE="Test Failure"
            ERROR_SUMMARY=$(echo "$ERROR_LOG" | grep -m1 "FAIL" | head -c 100)
          elif echo "$ERROR_LOG" | grep -q "Error:"; then
            ERROR_TYPE="Runtime Error"
            ERROR_SUMMARY=$(echo "$ERROR_LOG" | grep -m1 "Error:" | head -c 100)
          fi
          
          # Build task data
          TITLE="[CI] ${ERROR_TYPE}"
          NOTES="## CI/CD Failure
          
          **Workflow:** ${{ github.workflow }}
          **Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          **Branch:** \`${{ github.ref_name }}\`
          **Commit:** ${{ github.sha }}
          
          ### Error Summary
          ${ERROR_SUMMARY}
          
          ### Logs
          \`\`\`
          $(echo -e "$ERROR_LOG" | tail -50)
          \`\`\`
          
          ---
          *Auto-generated by VibeTasks*"
          
          # Escape for JSON
          TITLE_ESC=$(echo "$TITLE" | sed 's/"/\\"/g')
          NOTES_ESC=$(echo "$NOTES" | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')
          
          # Create task via Supabase API
          RESPONSE=$(curl -s -X POST \
            "${SUPABASE_URL}/rest/v1/tasks" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "{
              \"user_id\": \"${VIBETASKS_USER_ID}\",
              \"title\": \"${TITLE_ESC}\",
              \"notes\": \"${NOTES_ESC}\",
              \"notes_format\": \"markdown\",
              \"priority\": \"high\",
              \"status\": \"todo\",
              \"project_tag\": \"${{ github.event.repository.name }}\",
              \"created_by\": \"ai\"
            }")
          
          TASK_ID=$(echo "$RESPONSE" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
          
          if [ -n "$TASK_ID" ]; then
            echo "Created VibeTasks task: $TASK_ID"
            echo "::notice::VibeTasks task created: $TASK_ID"
          else
            echo "Failed to create task"
            echo "Response: $RESPONSE"
          fi

      - name: Fail if errors occurred
        if: steps.build.outcome == 'failure' || steps.test.outcome == 'failure'
        run: exit 1
